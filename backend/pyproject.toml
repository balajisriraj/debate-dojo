[project]
name = "debatedojo"
version = "0.1.0"
description = "Practise arguing with an AI that argues back, then get scored and coached."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
debatedojo = "debatedojo.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debatedojo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
